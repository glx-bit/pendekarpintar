:root{--ink:#1a1c2c;--navy:#29366f;--blue:#3b5dc9;--sky:#41a6f6;--cyan:#73eff7;--white:#f4f4f4;--grey:#94b0c2;--slate:#566c86;--dusk:#333c57;--yellow:#ffcd75;--orange:#ef7d57;--red:#b13e53;--lime:#a7f070;--green:#38b764;
 --disp:"Press Start 2P","Courier New",monospace;--text:"Jersey 20","Trebuchet MS",Verdana,sans-serif;--n:4px;
 --notch:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--white);font-family:var(--text);font-size:21px;line-height:1.12;font-synthesis:none;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
b,strong,h1,h2,h3,th,label{font-weight:400}
h1,h2,h3{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;border-radius:0;background:none;padding:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
#app{position:relative;width:100%;height:100vh;height:100dvh;max-width:1100px;margin:0 auto;background:var(--ink)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:10px;gap:8px;overflow:hidden}
.screen.active{display:flex}
.panel{background:var(--navy);padding:10px;clip-path:var(--notch);box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px var(--slate)}
.btn{--face:var(--yellow);--shade:var(--orange);--lite:#fff0c9;position:relative;min-height:46px;padding:9px 14px 15px;font-size:24px;line-height:1;color:var(--ink);background:var(--face);clip-path:var(--notch);box-shadow:inset 0 -6px 0 var(--shade),inset 0 3px 0 var(--lite)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--shade),inset 0 3px 0 var(--lite)}
.btn.big{min-height:60px;padding:16px 22px 22px;font-family:var(--disp);font-size:clamp(13px,3.8vw,18px)}

.pulse{animation:blink 1s steps(2) infinite}
.center{display:flex;align-items:center;justify-content:center}

/* JUDUL */
#s-title{padding:0}
.title-wrap{position:relative;flex:1;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;background:var(--sky)}

.title-ui .hint{color:var(--ink);font-size:21px}

/* SLOT */

/* BUAT KARAKTER */
.create{display:flex;gap:10px;flex:1;min-height:0;flex-direction:column}
.prevbox{display:flex;justify-content:center;flex:none}
.prevbox canvas{width:min(40vw,168px);height:min(40vw,168px);background:var(--sky);clip-path:var(--notch)}
.opts{display:flex;flex-direction:column;gap:9px;overflow:auto;flex:1;min-height:0}
.opts label{display:block;margin-bottom:3px;font-size:19px;color:var(--yellow)}
.opts input[type=text]{width:100%;height:46px;padding:0 10px;border:0;border-radius:0;background:var(--white);color:var(--ink);font-family:var(--text);font-size:26px;clip-path:var(--notch);user-select:text;-webkit-user-select:text}

.sw{display:flex;gap:7px;flex-wrap:wrap}

.sw button.txt{width:auto;height:36px;padding:0 10px 3px;background:var(--dusk);font-size:19px;box-shadow:inset 0 -3px 0 var(--ink)}
.sw button.txt.sel{background:var(--yellow);color:var(--ink);box-shadow:inset 0 -3px 0 var(--orange)}

/* PETA */
.herocard{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.herocard canvas{flex:none;width:60px;height:66px;background:var(--sky)}
.herocard .info{flex:1;min-width:0}
.hname{font-family:var(--disp);font-size:11px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;padding:0 6px 2px;background:var(--ink);font-family:var(--text);font-size:17px;line-height:1.1;color:var(--yellow);vertical-align:middle}
.bar{position:relative;height:15px;margin-top:3px;background:var(--ink);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .4s steps(8)}
.bar.b1 i{background:var(--lime);box-shadow:inset 0 -4px 0 var(--green)}.bar.b2 i{background:var(--sky);box-shadow:inset 0 -4px 0 var(--blue)}
.bar span{position:absolute;inset:0;text-align:center;font-size:16px;line-height:13px;text-shadow:1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink)}
.zeni{font-family:var(--disp);font-size:11px;color:var(--yellow);white-space:nowrap}
.ages{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;flex:none}
.age{flex:1 0 auto;min-width:62px;padding:5px 8px 8px;background:var(--dusk);font-size:17px;line-height:1.05;text-align:center;box-shadow:inset 0 -4px 0 var(--ink)}
.age b{display:block;font-family:var(--disp);font-size:16px;line-height:1.5}

.chip.grad{background:var(--yellow);color:var(--ink)}.arrive.grad{color:var(--lime);box-shadow:inset 0 0 0 2px var(--lime)}
.lis{display:block;width:max-content;margin:0 auto 6px;padding:1px 8px 3px;background:var(--orange);color:var(--ink);font-family:var(--disp);font-size:9px;line-height:1.6}
.age.sel{background:var(--yellow);color:var(--ink);box-shadow:inset 0 -4px 0 var(--orange)}
.zonecard{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:auto}
.zonecard h2{font-size:28px;line-height:1}
.zhead{display:flex;align-items:center;gap:10px}.zhead h2{margin:0}
.zmeta{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;color:var(--grey);font-size:18px;line-height:1.2;padding-bottom:8px;border-bottom:2px dashed var(--dusk)}
.stags{display:flex;gap:4px}.stag{font-style:normal;font-family:var(--disp);font-size:8px;line-height:1;padding:4px 6px 5px;color:var(--white)}
.stag.m{background:var(--orange);color:var(--ink)}.stag.e{background:var(--blue)}.stag.s{background:var(--green)}

.path{display:flex;flex-wrap:nowrap;gap:8px;justify-content:center;align-items:center;padding:6px 0 18px}
.node{position:relative;flex:none;width:clamp(46px,14.5vw,76px);height:clamp(46px,14.5vw,76px);display:flex;align-items:center;justify-content:center;background:var(--yellow);color:var(--ink);font-family:var(--disp);font-size:clamp(16px,4.4vw,22px);clip-path:none;box-shadow:inset 0 -7px 0 var(--orange),inset 0 3px 0 #fff0c9,0 0 0 3px var(--ink)}
.node:active:not(:disabled){transform:translateY(3px)}
.node.boss{background:var(--orange);color:var(--white);box-shadow:inset 0 -7px 0 var(--red),inset 0 3px 0 #ffb49c,0 0 0 3px var(--ink)}
.node.locked{background:var(--slate);color:var(--grey);box-shadow:inset 0 -7px 0 var(--dusk),0 0 0 3px var(--ink)}
.node .st{position:absolute;left:-6px;right:-6px;bottom:-18px;text-align:center;font-size:13px;white-space:nowrap}
.st1,.st0{display:inline-block;width:1em;height:1em;margin:0 1px;background:var(--i-star) center/contain no-repeat}.st0{background-image:var(--i-star0)}
.zoneart{display:block;flex:none;width:100%;height:clamp(92px,16vh,150px);object-fit:cover;clip-path:var(--notch)}
.jhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:21px}.jdist{font-size:17px;color:var(--grey)}
.jbar{height:8px;background:var(--ink)}.jbar i{display:block;height:100%;background:var(--yellow)}
#c-jmap{display:block;flex:none;width:100%;height:clamp(90px,15vh,150px);cursor:pointer;clip-path:var(--notch)}
.jch{display:flex;align-items:center;gap:8px;font-size:20px;line-height:1.1}.jch .grow{text-align:center}.jch .chip{margin-left:6px}.jch .icon:disabled{opacity:.35}
.arrive{padding:8px;background:var(--ink);font-size:21px;line-height:1.2;color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.entag{display:block;width:max-content;margin:0 auto 6px;padding:1px 8px 3px;background:var(--blue);color:var(--white);font-family:var(--disp);font-size:9px;line-height:1.6}
.credits{font-size:15px;color:var(--grey);margin:4px 0}.credits summary{cursor:pointer;font-size:17px}.credits div{margin-top:4px;line-height:1.25}
.scitag{display:block;width:max-content;margin:0 auto 6px;padding:1px 8px 3px;background:var(--green,#2a9d4a);color:var(--white);font-family:var(--disp);font-size:9px;line-height:1.6}
.qtext.long .entag,.qtext.long .scitag{margin-left:0}.qe{font-size:1.2em}
.say{display:inline-block;vertical-align:middle;margin-left:4px;padding:2px 7px 5px;background:var(--sky);font-size:.7em;line-height:1;box-shadow:inset 0 -3px 0 var(--blue)}
.node.next{animation:blink 1s steps(2) infinite}
.bottombar{display:flex;gap:8px;flex:none}.bottombar .btn{flex:1}
.badge{position:absolute;top:2px;right:4px;min-width:22px;padding:1px 5px 3px;background:var(--red);color:var(--white);font-size:17px;line-height:1}

/* BATTLE */
.hud{display:flex;gap:8px;align-items:center;padding:8px 10px;flex:none}
.hud .left{flex:1;min-width:0}
.hud .hearts{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:92px;flex:none}
.hp{width:16px;height:16px;background:var(--i-heart0) center/contain no-repeat}.hp.on{background-image:var(--i-heart)}
.hud .right{display:flex;gap:6px;align-items:center;flex:none}
.battle-main{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;width:100%;max-width:720px;margin:0 auto}
.scene-wrap{position:relative;flex:0 0 clamp(150px,33%,300px);width:100%;overflow:hidden;background:#000;clip-path:var(--notch)}
.scene-wrap canvas{display:block;width:100%;height:100%;object-fit:cover}
.banner{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:21px;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink);pointer-events:none;transition:opacity .3s}
.dots{position:absolute;left:8px;top:8px;display:flex;gap:5px;pointer-events:none}
.dots i{width:10px;height:10px;background:var(--dusk);box-shadow:0 0 0 2px var(--ink)}.dots i.on{background:var(--lime)}.dots i.cur{background:var(--yellow);animation:blink .6s steps(2) infinite}
.combo{position:absolute;left:8px;top:26px;font-family:var(--disp);font-size:11px;color:var(--yellow);text-shadow:2px 2px 0 var(--ink);pointer-events:none}
.eplate{position:absolute;right:6px;top:6px;min-width:118px;max-width:62%;padding:5px 8px 7px;background:rgba(26,28,44,.86);box-shadow:inset 0 0 0 2px var(--grey);font-size:19px;line-height:1;pointer-events:none}
.eplate .elv{margin-right:6px;font-family:var(--disp);font-size:9px;color:var(--yellow)}
.eplate.boss{box-shadow:inset 0 0 0 2px var(--yellow)}.eplate.boss .enm{color:var(--yellow)}
.ebar{height:8px;margin-top:5px;background:#4a1a2a}.ebar i{display:block;height:100%;transition:width .25s steps(6)}
.flt{position:absolute;z-index:3;transform:translate(-50%,-100%);font-family:var(--disp);font-size:11px;white-space:nowrap;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink);pointer-events:none;animation:flt 1.2s steps(14) forwards}
.flt.big{font-size:15px}
.qpanel{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px;overflow:auto}
.qbox{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.qtext{max-width:19em;font-size:clamp(30px,6.6vw,40px);line-height:1.08}
.qtext.long{max-width:25em;font-size:clamp(24px,5.4vw,28px);line-height:1.12;text-align:left}
.qtext b{color:var(--yellow)}.qtext small{display:block;margin-top:4px;font-size:.62em;color:var(--grey)}
.qvis{width:100%;font-size:clamp(22px,5.4vw,32px);line-height:1.22}.qvis svg{width:100%!important;height:auto;max-height:17vh}.qvis svg text{font-family:var(--text)}.qvis:empty{display:none}
.qvis .hint{font-size:17px}
.erow{display:inline-block;margin:2px 6px}.gone{opacity:.22;filter:grayscale(1)}
.addvis{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.cmp{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.vs{font-size:19px;color:var(--grey)}
.box{display:inline-block;min-width:1.25em;padding:0 5px 2px;color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow);line-height:1}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.9em}
.frac i{font-style:normal;padding:0 4px 1px}.frac i:first-child{border-bottom:2px solid currentColor}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.ans{--c1:#94b0c2;--sh:#566c86;--li:#c9d8e2;min-height:clamp(50px,8.2vh,66px);padding:4px 6px 10px;font-size:clamp(27px,6vw,36px);line-height:1;color:var(--ink);background:var(--c1);clip-path:var(--notch);box-shadow:inset 0 -6px 0 var(--sh),inset 0 3px 0 var(--li);transition:opacity .2s}
.ans:nth-child(1){--c1:#41a6f6;--sh:#3b5dc9;--li:#73eff7}.ans:nth-child(2){--c1:#ffcd75;--sh:#ef7d57;--li:#fff0c9}
.ans:nth-child(3){--c1:#a7f070;--sh:#38b764;--li:#dcfcc0}.ans:nth-child(4){--c1:#ef7d57;--sh:#b13e53;--li:#ffb49c}
.ans:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--sh),inset 0 3px 0 var(--li)}
.answers.long .ans{font-size:clamp(20px,4.5vw,26px)}.answers.xlong{grid-template-columns:1fr}.answers.xlong .ans{min-height:44px;font-size:clamp(20px,4.3vw,24px)}
.ans.ok{--c1:#a7f070;--sh:#38b764;--li:#dcfcc0;box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 6px var(--white);animation:blink .3s steps(2) 3}
.ans.bad{--c1:#566c86;--sh:#333c57;--li:#566c86;color:var(--grey);text-decoration:line-through;animation:shake .3s steps(6)}
.ans.gone2{opacity:0;pointer-events:none}
.tools{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;flex:none}
.qpanel:has(.feedback) .tools{display:none}
.tools .btn.small{padding:5px 8px 9px;font-size:19px}
.pips{display:flex;gap:4px;align-items:center;font-size:19px}
.pips i{width:12px;height:12px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--yellow)}.pips i.on{background:var(--yellow)}
.pips.ready{color:var(--yellow);animation:blink .5s steps(2) infinite}
.numdisp{min-height:1.5em;padding:2px;background:var(--ink);font-family:var(--disp);font-size:22px;line-height:1.5;text-align:center;box-shadow:inset 0 0 0 2px var(--yellow)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}

.numpad button:active{transform:translateY(2px)}.numpad .go{background:var(--lime);box-shadow:inset 0 -5px 0 var(--green)}
.feedback{display:flex;flex-direction:column;gap:8px;text-align:center}
.feedback div.big{font-family:var(--disp);font-size:13px;line-height:1.5;color:var(--orange)}
.feedback .exp{font-size:22px;line-height:1.15}
.feedback .good{color:var(--lime)}

/* KEMAH */
.camp{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.camp>.left{display:flex;flex-direction:column;gap:8px;flex:none}
.camp>.right{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.campprev{display:flex;gap:10px;align-items:center}

.tabs{display:flex;gap:5px;flex:none}
.tab{flex:1;padding:6px 2px 9px;background:var(--dusk);font-size:clamp(15px,3.5vw,19px);line-height:1;box-shadow:inset 0 -3px 0 var(--ink)}
.tab.sel{background:var(--yellow);color:var(--ink);box-shadow:inset 0 -3px 0 var(--orange)}
.tabbody{flex:1;min-height:0;overflow:auto;padding-right:2px}
.statrow{display:flex;align-items:center;gap:10px;padding:7px 8px;margin-bottom:6px;background:rgba(26,28,44,.55)}
.statrow .ic{width:30px;font-size:22px;text-align:center}
.statrow .nm{font-family:var(--disp);font-size:12px;line-height:1.5}.statrow .ds{font-size:17px;color:var(--grey)}
.statrow .val{min-width:44px;font-family:var(--disp);font-size:15px;text-align:center;color:var(--yellow)}
.statrow .plus{width:44px;height:44px;background:var(--lime);color:var(--ink);font-family:var(--disp);font-size:16px;box-shadow:inset 0 -5px 0 var(--green)}
.statrow .plus:disabled{background:#465270;color:var(--grey);box-shadow:inset 0 -5px 0 var(--dusk)}
.pts{margin-bottom:6px;font-size:22px;text-align:center;color:var(--yellow)}
.cats{display:flex;gap:5px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.cat{flex:1 0 auto;padding:6px 9px 9px;background:var(--dusk);font-size:18px;line-height:1;white-space:nowrap;box-shadow:inset 0 -3px 0 var(--ink)}
.cat.sel{background:var(--yellow);color:var(--ink);box-shadow:inset 0 -3px 0 var(--orange)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.item{display:flex;flex-direction:column;gap:4px;align-items:center;padding:8px 6px;background:rgba(26,28,44,.6);text-align:center;box-shadow:inset 0 0 0 2px var(--slate)}
.item.eq{box-shadow:inset 0 0 0 3px var(--lime)}
.item .ipv{width:76px;height:84px;background:var(--sky)}
.item .ie{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:30px}
.item .in{font-size:19px;line-height:1}.item .ijob{font-size:15px;line-height:1;color:var(--yellow)}.item.lk .ipv{filter:saturate(.75)}.item .ib{min-height:1.1em;font-size:16px;color:var(--cyan)}
.tree{display:flex;flex-direction:column;gap:8px}
.jobcard{display:flex;gap:10px;align-items:center;padding:8px;background:rgba(26,28,44,.6);box-shadow:inset 0 0 0 2px var(--slate)}
.jobcard.cur{box-shadow:inset 0 0 0 3px var(--yellow)}

.jobcard .jt{font-size:23px;line-height:1.05}.jobcard .jd{font-size:17px;color:#c9d8e2}
.tier{display:inline-block;margin-left:5px;padding:0 5px 2px;background:var(--blue);font-size:15px;vertical-align:middle}
.rep table{width:100%;border-collapse:collapse;font-size:19px}.rep td,.rep th{padding:5px;border-bottom:2px solid var(--dusk);text-align:center}

/* MODAL, PUJIAN, TOAST */
#modals{position:fixed;inset:0;z-index:50;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(26,28,44,.86);pointer-events:auto}
.win{width:min(520px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:16px 14px;text-align:center;animation:popin .2s steps(4)}
.win h2{font-family:var(--disp);font-size:clamp(13px,4vw,17px);line-height:1.5;color:var(--yellow)}
.stars{font-size:clamp(34px,10vw,50px);letter-spacing:6px}

.rew{display:flex;flex-direction:column;gap:3px;padding:8px 12px;background:rgba(26,28,44,.6);font-size:21px;text-align:left}
.rew .lv{color:var(--lime)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.evo{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;background:rgba(26,28,44,.6);box-shadow:inset 0 0 0 2px var(--yellow)}
.evo canvas{width:88px;height:96px;background:var(--sky)}
#evoc{width:min(70vw,238px);height:min(70vw,238px);box-shadow:0 0 0 3px var(--yellow)}
#praise{position:fixed;left:50%;top:30%;z-index:40;display:none;transform:translate(-50%,-50%);font-family:var(--disp);font-size:clamp(17px,5.6vw,34px);line-height:1.4;color:var(--yellow);text-align:center;white-space:nowrap;text-shadow:3px 3px 0 var(--red),6px 6px 0 var(--ink);pointer-events:none}
#praise.show{display:block;animation:praise 1s steps(12) forwards}
#praise small{display:block;font-size:.5em;color:var(--white);text-shadow:2px 2px 0 var(--ink)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45;image-rendering:auto}
#toasts{position:fixed;left:0;right:0;top:62px;z-index:46;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 10px;pointer-events:none}
.toast{padding:5px 14px 8px;background:var(--lime);color:var(--ink);font-size:21px;line-height:1.05;text-align:center;box-shadow:inset 0 -4px 0 var(--green);animation:toast 2.4s steps(20) forwards}
.toast.job{background:var(--sky);box-shadow:inset 0 -4px 0 var(--blue)}
.toast.bad{background:#ffc2cf;box-shadow:inset 0 -4px 0 #e04860}
.toast.evo{background:var(--yellow);box-shadow:inset 0 -4px 0 var(--orange)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px solid var(--dusk);font-size:22px;text-align:left}
.seg{display:flex;gap:5px}.seg button{padding:5px 10px 8px;background:var(--dusk);font-size:19px;line-height:1;box-shadow:inset 0 -3px 0 var(--ink)}.seg button.sel{background:var(--yellow);color:var(--ink);box-shadow:inset 0 -3px 0 var(--orange)}

@media (min-aspect-ratio:5/4) and (min-width:700px){
 .create{flex-direction:row}.prevbox{align-items:center}.prevbox canvas{width:220px;height:220px}
 .camp{flex-direction:row;gap:12px}

 .camp>.right{min-width:0}
 .tabs{overflow-x:auto}
 .campprev{flex-direction:column;align-items:stretch}.campprev canvas{align-self:center;width:180px;height:180px}
 .battle-main{flex-direction:row;max-width:1060px}
 .scene-wrap{flex:1 1 46%;height:auto;align-self:center;aspect-ratio:4/3;max-height:100%}

}

  if(a>=10&&b>=10){const ta=Math.floor(a/10),tb=Math.floor(b/10),oa=a%10,ob=b%10;return `Puluhan: ${ta}+${tb}=${ta+tb} → ${(ta+tb)*10}. Satuan: ${oa}+${ob}=${oa+ob}. Gabung: ${(ta+tb)*10} + ${oa+ob} = ${s}.`;}
  return `${a} + ${b} = ${s}.`;
 }
 function exSub(a,b){
  const s=a-b; if(a<=10)return `${a} − ${b} = ${s}. Hitung mundur ${b} langkah dari ${a}.`;

 }

function makeScene(cv,zi){
 const sc={cv,zi,hero:null,mon:null,parts:[],shake:0,amb:[],clouds:[],W:0,q:BUF_H/260,Wd:480,hx:130,hy:206,mx:350,my:202,bg:null,wrap:cv.parentNode,plate:null,pk:''};
 for(let i=0;i<10;i++)sc.amb.push({x:rnd(0,1),y:rnd(0,1),ph:rnd(0,6),c:rpick(AMB[ZONES[zi].part])});
 for(let i=0;i<4;i++)sc.clouds.push({x:rnd(0,1),y:(rnd(4,20))|0,v:rnd(.004,.012),w:(rnd(9,16))|0});
 if(cv.id==='c-battle'){const p=document.createElement('div');p.className='eplate';p.style.display='none';p.innerHTML='<b class="elv"></b><span class="enm"></span><div class="ebar"><i></i></div>';sc.wrap.appendChild(p);sc.plate=p;}
 sceneResize(sc);return sc;}
function sceneResize(sc){
 const cv=sc.cv,W=clamp(Math.round(BUF_H*Math.max(40,cv.clientWidth)/Math.max(40,cv.clientHeight)),90,720);
 if(cv.width!==W||cv.height!==BUF_H){cv.width=W;cv.height=BUF_H;}
 if(sc.W!==W||!sc.bg){sc.W=W;sc.Wd=W/sc.q;sc.bg=getTerrain(sc.zi,W);}
 const Wd=sc.Wd,sep=Math.min(Wd*.46,250);sc.hx=Wd/2-sep/2;sc.mx=Wd/2+sep/2;sc.hy=206;sc.my=202;
 if(sc.hero){sc.hero.x=sc.hx;sc.hero.y=sc.hy;}if(sc.mon){sc.mon.x=sc.mx;sc.mon.y=sc.my;}
}

 c.drawImage(sc.bg,ox,oy);
 if(Z.deco==='tree'||Z.deco==='cactus')sc.clouds.forEach(cl=>{cl.x+=dt*cl.v;if(cl.x>1.1)cl.x=-.1;const cx=(cl.x*W)|0;px(c,cx,cl.y,cl.w,2,'#f4f4f4');px(c,cx+2,cl.y-1,cl.w-5,1,'#f4f4f4');px(c,cx+1,cl.y+2,cl.w-3,1,'#c9d8e2');});
 const m=sc.mon,h=sc.hero;
 if(m){const md=MONS[m.key],bx0=Math.round((m.x+m.dx)*q)+ox,by0=Math.round((m.y+m.dy)*q)+oy;
  if(md.spr)drawSprMon(c,m,md,t,bx0,by0);
  else{const fly=md.g==='bat'||md.g==='ghost',spr=monSprite(m.key,Math.floor(t*(md.g==='bat'?6:3))%2),s=m.boss?2:1;
  const bx=bx0,by=by0,lift=fly?4+(Math.sin(t*3)>0?1:0):(Math.sin(t*3+1)>.6?1:0);
  c.globalAlpha=.3*m.alpha;px(c,bx-7*s,by-1,14*s,2,'#000');c.globalAlpha=m.alpha;
  c.drawImage(m.flash?tinted(spr,'#fff'):spr,0,0,spr.width,spr.height,bx-Math.round(spr.width*s/2),by-(spr.height+lift)*s+s,spr.width*s,spr.height*s);c.globalAlpha=1;}
  m.hpShown+=(m.hp-m.hpShown)*Math.min(1,dt*8);}
 if(sc.plate){const on=!!(m&&m.alpha>.9&&m.showBar);sc.plate.style.display=on?'':'none';
  if(on){const k=m.name+'|'+m.lv;if(sc.pk!==k){sc.pk=k;sc.plate.children[0].textContent='Lv '+(m.lv||1);sc.plate.children[1].textContent=m.name;sc.plate.classList.toggle('boss',!!m.boss);}
   const f=clamp(m.hpShown/m.max,0,1),bar=sc.plate.lastChild.firstChild;bar.style.width=(f*100)+'%';bar.style.background=f>.5?'#a7f070':f>.25?'#ffcd75':'#ef7d57';}}
 if(h){const hx=Math.round((h.x+h.dx)*q)+ox,hy=Math.round((h.y+h.dy-(h.jump||0))*q)+oy-(Math.sin(t*3)>0?1:0);
  c.globalAlpha=.3;px(c,hx-8,Math.round(h.y*q)+oy-1,16,2,'#000');c.globalAlpha=1;
  if(h.trail){h.tr=h.tr||[];h.tr.push([hx,hy,h.rot||0,h.flip]);if(h.tr.length>6)h.tr.shift();h.tr.forEach((g,i)=>{if(i%2)return;drawHeroPx(c,g[0],g[1],1,h.h,{t,emo:h.emo,alpha:.18+i*.05,flash:1,flashColor:h.h.job.c[1],rot:g[2],flip:g[3]});});}else if(h.tr)h.tr.length=0;
  if(h.alpha>0)drawHeroPx(c,hx,hy,1,h.h,{t,emo:h.emo,flash:h.flash,flashColor:h.flashColor,alpha:h.alpha,swing:h.swing||0,rot:h.rot,flip:h.flip,sq:h.sq});
  if(h.flash>0)h.flash=Math.max(0,h.flash-dt*2.2);}
 drawFx(sc,c,ox,oy);
 for(let i=sc.parts.length-1;i>=0;i--){const p=sc.parts[i];p.life-=dt;if(p.life<=0){sc.parts.splice(i,1);continue;}p.vy+=160*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;px(c,Math.round(p.x*q)+ox,Math.round(p.y*q)+oy,p.life>.3?2:1,p.life>.3?2:1,p.c);}
 sc.amb.forEach(a=>{if(Math.sin(t*2+a.ph)>.2){a.y-=dt*.02;if(a.y<0){a.y=1;a.x=Math.random();}px(c,(a.x*W)|0,(a.y*BUF_H)|0,1,1,a.c);}});
}

 el.innerHTML=`<div class="hint" style="margin-bottom:6px">Perlengkapan untuk kelas <b>${FAMS[fam]}</b>. Beli lalu langsung dipakai — lihat karaktermu berubah!</div><div class="cats">${cats.map(k=>`<button class="cat ${k===shopCat?'sel':''}" data-c="${k}">${k==='potion'?'🧪 Ramuan':k==='pet'?'🐾 Pet':k==='job'?'⭐ Khas Job':SLOT_INFO[k].e+' '+SLOT_INFO[k].n}</button>`).join('')}</div><div class="items">${list}</div>`;
 $$('canvas.ipv',el).forEach(cv=>{const it=ITEM[cv.dataset.it],jid=it.jobs&&!it.jobs.includes(H.jobId)?it.job:H.jobId,hv=heroOf(H,jid);hv.eq=Object.assign({},hv.eq,{[it.slot]:it});live(cv,(c,t)=>{drawPreview(cv,hv,t);const ic=WICON_MAP[it.id]!=null&&wIcon(it.id,32);if(ic){const k=Math.max(1,Math.floor(cv.width/76));c.imageSmoothingEnabled=false;c.drawImage(ic,2*k,2*k,32*k,32*k);}});});
 $$('.cat',el).forEach(b=>b.onclick=()=>{GAUDIO.sfx('click');shopCat=b.dataset.c;renderCamp();});
 $$('[data-act]',el).forEach(b=>b.onclick=()=>{
  const a=b.dataset.act;
  if(a==='potion'){if(H.zeni>=POTION_PRICE&&H.potions<9){H.zeni-=POTION_PRICE;H.potions++;GAUDIO.sfx('buy');persist();renderCamp();}return;}
  const it=ITEM[b.dataset.id];
  if(it.jobs&&!it.jobs.includes(H.jobId))return;
  if(a==='buy'){if(H.zeni<it.price||H.baseLv<it.lv)return;H.zeni-=it.price;H.owned[it.id]=1;GAUDIO.sfx('buy');}
  else GAUDIO.sfx('equip');
  H.equip[fam]=H.equip[fam]||{};H.equip[fam][it.slot]=it.id;
  if(a==='buy'){const cv=$('#c-camp');const r=cv.getBoundingClientRect();fxBurst(r.left+r.width/2,r.top+r.height/2,26,{star:1,max:260});}
  persist();renderCamp();});
}
function tabJob(el){
 const job=JOBS[H.jobId],need=jobNeed(H.jobLv),ready=canEvolve(),evoAt=EVO_LV[job.tier];
 let h=`<div class="jobcard cur"><canvas width="72" height="84" id="jc-cur"></canvas><div class="grow"><div class="jt">${job.e} ${job.n}<span class="tier">${TIER_NAME[job.tier]}</span></div><div class="jd">${job.d}</div><div class="jd">⚡ Jurus: <b>${job.skill[0]}</b> (×${(job.skill[1]+.05*H.jobLv).toFixed(1)}${job.skill[2]?`, pulihkan ${job.skill[2]} ❤️`:''})</div><div class="jd">Bonus ${STAT_INFO[job.stat].e} ${STAT_INFO[job.stat].n} +${Math.floor(H.jobLv/2)} dari Job Level</div></div></div>`;
 if(job.tier<3){h+=`<div class="pts" style="margin-top:8px">${ready?'✨ Siap evolusi! Pilih jalur barumu:':`Capai Job Level ${evoAt} untuk evolusi (sekarang ${H.jobLv})`}</div><div class="bar b2" style="height:18px"><i style="width:${Math.min(100,H.jobLv/evoAt*100)}%"></i><span style="line-height:18px;font-size:12px">Job Lv ${H.jobLv} / ${evoAt}</span></div><div class="tree" style="margin-top:8px">`;
  job.next.forEach(id=>{const n=JOBS[id];h+=`<div class="jobcard ${ready?'':'locked'}" style="${ready?'':'opacity:.65'}"><canvas width="72" height="84" data-j="${id}"></canvas><div class="grow"><div class="jt">${n.e} ${n.n}<span class="tier">${TIER_NAME[n.tier]}</span></div><div class="jd">${n.d}</div><div class="jd">⚡ ${n.skill[0]}${n.skill[2]?' (menyembuhkan)':''}</div></div><button class="btn ${ready?'':'gray'} small" data-evo="${id}" ${ready?'':'disabled'}>${ready?'Pilih!':'🔒'}</button></div>`;});
  h+='</div>';}
 else h+='<div class="pts" style="margin-top:10px">🏆 Job tertinggi! Terus naikkan Job Level-mu.</div>';
 el.innerHTML=h;
 const dj=(cv,id)=>{const hv=heroOf(H,id);live(cv,(c,t)=>drawPreview(cv,hv,t,3,JOBS[id].tier));};
 dj($('#jc-cur',el),H.jobId);$$('canvas[data-j]',el).forEach(cv=>dj(cv,cv.dataset.j));
 $$('[data-evo]',el).forEach(b=>b.onclick=()=>{GAUDIO.sfx('click');const id=b.dataset.evo;confirmBox(`Evolusi menjadi ${JOBS[id].n}? Job Level akan mulai dari 1 lagi.`,()=>doEvolve(id,()=>renderCamp()),'Evolusi!','Nanti');});
}
function tabRep(el){
 let tc=0,tw=0;const rows=JENJANG.map((z,i)=>{const l=H.log[i]||{c:0,w:0},t=l.c+l.w;tc+=l.c;tw+=l.w;if(!t&&!unlocked(i))return '';return `<tr><td>${z.e} ${z.c}</td><td>${l.c}</td><td>${l.w}</td><td>${t?Math.round(l.c/t*100)+'%':'-'}</td></tr>`;}).join('');
 el.innerHTML=`<div class="rep"><h3 style="margin-bottom:6px">📋 Laporan Belajar</h3><table><tr><th>Level</th><th>Benar</th><th>Salah</th><th>Akurasi</th></tr>${rows}<tr><th>Total</th><th>${tc}</th><th>${tw}</th><th>${tc+tw?Math.round(tc/(tc+tw)*100)+'%':'-'}</th></tr></table><div class="hint" style="margin-top:8px">Untuk orang tua/guru: akurasi rendah di satu level berarti materi tersebut perlu diulang bersama.</div></div>`;
}

/* ====================== EVOLUSI ====================== */
function openEvolveChoice(done){
 const job=JOBS[H.jobId];
 const m=openModal(`<h2>✨ Pilih Jalur Evolusi!</h2><div class="cards">${job.next.map(id=>{const n=JOBS[id];return `<div class="evo"><canvas width="96" height="112" data-j="${id}"></canvas><b>${n.e} ${n.n}</b><span class="tier">${TIER_NAME[n.tier]}</span><div class="jd" style="font-size:13px">${n.d}</div><div style="font-size:13px">⚡ ${n.skill[0]}</div><button class="btn green small" data-evo="${id}">Pilih ini!</button></div>`;}).join('')}</div><button class="btn gray small" id="ev-later">Nanti saja</button>`);
 $$('canvas[data-j]',m).forEach(cv=>{const id=cv.dataset.j,hv=heroOf(H,id);live(cv,(c,t)=>drawPreview(cv,hv,t,4,JOBS[id].tier));});
 $$('[data-evo]',m).forEach(b=>b.onclick=()=>{GAUDIO.sfx('click');const id=b.dataset.evo;closeModal(m);doEvolve(id,done);});
 $('#ev-later',m).onclick=()=>{GAUDIO.sfx('click');closeModal(m);};
}
async function doEvolve(newId,done){
 const old=heroOf(H),neu=heroOf(H,newId),nj=JOBS[newId];
 const m=openModal(`<h2 id="evt">Evolusi...</h2><div class="center"><canvas id="evoc" width="170" height="170"></canvas></div><div id="evd" style="min-height:64px"></div><button class="btn green big" id="ev-ok" style="display:none">Hore! ▶</button>`);
 const cv=$('#evoc',m),t0=TIME;GAUDIO.jingle('evolve');let burst=false,rain=false;
 live(cv,(c,t)=>{const e=t-t0;c.imageSmoothingEnabled=true;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,170,170);
  const g=c.createRadialGradient(85,95,5,85,95,95);g.addColorStop(0,e<1.8?'#5a5ad0':'#ffd54f');g.addColorStop(1,'#0d1030');c.fillStyle=g;c.fillRect(0,0,170,170);
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2+e*2,r=e<1.8?Math.max(10,90-e*45):20+(e-1.8)*60;c.fillStyle=e<1.8?'#fff':'#ffd54f';c.fillRect(85+Math.cos(a)*r,95+Math.sin(a)*r,4,4);}
  const who=e<1.8?old:neu;
  drawHeroArt(c,85,152+Math.sin(t*3)*2,.68,who,{t,emo:e<1.8?'n':'happy',flash:e<1.8?Math.min(1,e/1.8)*.9:0,flashColor:'#ffffff'});
  if(e>1.7&&e<2.1){c.fillStyle='rgba(255,255,255,'+(1-Math.abs(e-1.9)/.2)+')';c.fillRect(0,0,170,170);}
  if(e>1.85&&!burst){burst=true;const r=cv.getBoundingClientRect();fxBurst(r.left+r.width/2,r.top+r.height/2,90,{star:1,max:520});}
  if(e>2.2&&!rain){rain=true;fxRain(2400,90);}
 });
 await sleep(2300);if(!m.isConnected)return;
 H.jobId=newId;H.jobLv=1;H.jobExp=0;persist();
 $('#evt',m).textContent='🎉 Kamu menjadi '+nj.n+'!';
 $('#evd',m).innerHTML=`<div style="font-size:18px">${nj.d}</div><div style="font-size:16px;margin-top:4px">⚡ Jurus baru: <b style="color:#ffd54f">${nj.skill[0]}</b></div>`;
 praise('EVOLUSI!','✨ '+nj.n+' ✨');
 const ok=$('#ev-ok',m);ok.style.display='';ok.onclick=()=>{GAUDIO.sfx('click');closeModal(m);done&&done();};
}

 ['title','slots','create','map','battle','camp'].forEach(n=>SCR[n]=$('#s-'+n));
 sprLoad();loadSave();fxInit();
 GAUDIO.setMusic(SAVE.settings.music);GAUDIO.setSfx(SAVE.settings.sfx);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)GAUDIO.init();});
 requestAnimationFrame(loop);showTitle();
 window.__mq={get H(){return H;},get B(){return B;},SAVE,startBattle,showCamp,showMap,calc};
}

boot();
